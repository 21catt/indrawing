<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인체 드로잉 확장편</title>

<!-- 홈 화면 아이콘 — 이 페이지가 존재하는 유일한 이유다.
     앱(구글 Apps Script)은 구글 페이지 안쪽에서 돌아가 아이폰이 아이콘을 찾는
     자리에 손이 닿지 않는다. 그래서 아이콘만 달고 앱을 그대로 띄우는 껍데기를 둔다.
     ⚠️ 앱을 여기에 "담는" 이유: 주소만 넘기고 사라지면 「홈 화면에 추가」를 할
        페이지가 없어진다. 담으면 안내 화면 없이 바로 앱이 뜨면서 추가도 된다. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인체 드로잉">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDECEC">

<style>
  :root{--ground:#EDECEC;--ink:#26282E;--soft:#767B87;--gold:#F0C98A;--deep:#8A6520}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ground)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  #app{border:0;width:100%;height:100%;display:block}

  /* 여는 동안 — 흰 화면이 번쩍이지 않게 아이콘만 조용히 띄운다 */
  #wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1rem;background:var(--ground);transition:opacity .3s ease}
  #wait img{width:76px;height:76px;border-radius:18px;box-shadow:0 6px 14px rgba(146,149,168,.3)}
  #wait span{font-size:.86rem;color:var(--soft)}
  #wait.off{opacity:0;pointer-events:none}


  /* 앱이 끝내 안 열릴 때만 나오는 자리 */
  #fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:1.6rem}
  #fail .card{max-width:22rem;background:#fff;border-radius:24px;padding:2rem 1.6rem;text-align:center;
    box-shadow:0 12px 30px rgba(146,149,168,.28)}
  #fail a{display:block;margin-top:1.1rem;background:var(--gold);color:var(--deep);
    text-decoration:none;font-weight:700;padding:.9rem;border-radius:14px}
</style>
</head>
<body>
  <iframe id="app" title="인체 드로잉 확장편" allow="clipboard-write"></iframe>

  <div id="wait"><img src="icon-180.png" alt=""><span>여는 중…</span></div>

  <div id="fail"><div class="card">
    <b>앱을 여기에 띄우지 못했습니다</b>
    <a id="direct" href="#">수업 앱 열기</a>
  </div></div>

<script>
  /* 수업 앱 주소. 배포를 「연필 ✏️ → 새 버전」으로 하면 이 주소는 그대로다.
     「새 배포」로 새로 만들면 주소가 바뀌므로 이 한 줄만 갈아 끼우면 된다. */
  var APP = "https://script.google.com/macros/s/"
          + "AKfycbwfuOyHr2QLuZNnRU35Cz2a1ng5LhVsPbQvOS67TLObvCurHnRgLlYulYxxecoy1Wy40w"
          + "/exec";

  var frame = document.getElementById("app");
  var wait  = document.getElementById("wait");
  var fail  = document.getElementById("fail");
  document.getElementById("direct").href = APP;

  /* ⚠️ 듣는 쪽을 먼저 걸고 주소를 넣는다 — 순서를 뒤집으면 이미 끝난 로드를
     놓쳐 "여는 중…" 이 영영 안 걷힌다. */
  var opened = false;
  frame.addEventListener("load", function () {
    opened = true;
    wait.classList.add("off");
  });
  frame.src = APP;

  /* 끝내 안 열리면 직접 가는 길을 준다 — 흰 화면으로 버려두지 않는다 */
  setTimeout(function () {
    if (!opened) { wait.classList.add("off"); fail.style.display = "flex"; }
  }, 10000);

</script>
</body>
</html>
